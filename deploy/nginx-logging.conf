# Formato del access_log de nginx SIN query string ni Referer.
#
# El formato por defecto ("combined") escribe `$request` completo, y el callback OAuth llega como
# `/auth/callback?code=...&state=...`: el código quedaría en /var/log/nginx/access.log 14 días.
# `$uri` es la ruta sin parámetros. Tampoco se registra el Referer (puede traer parámetros ajenos).
#
# Instalación (en el servidor, ver DEPLOY.md § "Logs de nginx"):
#   sudo install -m 0644 deploy/nginx-logging.conf /etc/nginx/conf.d/00-purgito-logging.conf
#   en /etc/nginx/nginx.conf:  access_log /var/log/nginx/access.log purgito;
#   sudo nginx -t && sudo systemctl reload nginx
#
# Los errores de nginx (error.log) pueden citar la petición completa cuando falla un upstream: por eso
# el callback OAuth no debe fallar con el código a la vista; se comprueba con deploy/preflight_check.sh.
log_format purgito '$remote_addr - $remote_user [$time_local] '
                   '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                   '"-" "$http_user_agent"';
