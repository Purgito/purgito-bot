<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>Purgito Studio</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/lexend-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/css/studio.css" />
    <script type="module" src="/js/main.mjs"></script>
  </head>
  <body>
    <a class="skip" href="#main">Saltar al contenido</a>
    <div class="app">
      <aside class="sidebar" id="sidebar" aria-label="Navegación principal">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">P</span>
          <span class="brand-name">Purgito <strong>Studio</strong></span>
          <button type="button" class="icon-btn only-narrow" id="close-menu" aria-label="Cerrar menú"></button>
        </div>
        <nav aria-label="Secciones">
          <ul id="nav"></ul>
        </nav>
        <div class="sidebar-foot">
          <p class="private"><span class="private-dot" aria-hidden="true"></span>Acceso privado</p>
          <p class="foot-note">Datos agregados en tu infraestructura. Sin conversaciones ni perfiles de personas.</p>
        </div>
      </aside>
      <div class="scrim" id="scrim" hidden></div>

      <div class="main-col">
        <header class="topbar">
          <button type="button" class="icon-btn only-narrow" id="menu" aria-controls="sidebar" aria-expanded="false" aria-label="Abrir menú"></button>
          <div class="topbar-title">
            <h1 id="title" tabindex="-1">Resumen</h1>
            <p id="blurb" class="blurb"></p>
          </div>
          <div class="topbar-actions">
            <p id="freshness" class="freshness" role="status"><span class="dot" aria-hidden="true"></span><span id="freshness-text">Cargando…</span></p>
            <button type="button" class="btn btn-ghost" id="refresh">Actualizar</button>
            <button type="button" class="btn btn-ghost" id="open-glossary" aria-haspopup="dialog">Glosario</button>
          </div>
        </header>

        <form id="filters" class="filterbar" aria-label="Filtros de datos" novalidate></form>
        <section id="quality" class="quality" aria-label="Calidad de los datos"></section>
        <div id="notice" class="notice-slot" role="status" aria-live="polite"></div>

        <main id="main" tabindex="-1">
          <div id="content" aria-busy="true"></div>
        </main>
        <footer class="foot">Purgito Studio mide uso y adopción; Prometheus y el monitor operativo siguen midiendo la salud.</footer>
      </div>
    </div>

    <dialog id="glossary" aria-labelledby="glossary-title"></dialog>
    <dialog id="coverage-dialog" aria-labelledby="coverage-title"></dialog>
    <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  </body>
</html>
