title = "purgito-bot gitleaks config"

# Reglas default de gitleaks + excepciones puntuales de este repo.
[extend]
useDefault = true

[allowlist]
description = """
Dumps externos de referencia (ver CLAUDE.md: referencias/ es gitignored y no
es parte del proyecto). Quedan en el historial de git de antes de que se
ignoraran (commit 52f6f44); no contienen secretos reales, solo snowflakes de
Discord (guild/channel IDs) que la regla discord-client-id confunde con IDs
de cliente OAuth.
"""
paths = [
  '''^referencias/''',
]
# Valores inventados de los tests y la documentación de observabilidad (ver
# tests/test_obs_events.py y docs/SECURITY_EVENTS.md): ejercitan la redacción
# de secretos, no son credenciales. Se permiten por valor y no por fingerprint
# porque el fingerprint incluye el hash del commit y no sobrevive a un squash.
regexes = [
  '''^unsecreto-largo-1$''',
  '''^abcdef0123456789$''',
  '''^ab12cd34ef56$''',
  # Claves PÚBLICAS de age (destinatarios «age1…», 62 caracteres bech32) usadas
  # como fixtures en tests/test_backup_*.py: por diseño son públicas y no
  # permiten descifrar nada. Las privadas («AGE-SECRET-KEY-1…») NO se permiten.
  '''^age1[02-9ac-hj-np-z]{58}$''',
  # Fixture de tests/test_backup_isolation.py (SECRET64 = "0123456789abcdef" * 4).
  '''^0123456789abcdef$''',
]
