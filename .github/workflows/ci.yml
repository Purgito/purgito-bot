name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Token de solo lectura para todos los jobs: ninguno escribe en el repo ni en
# PRs/issues. Sin este bloque, los permisos por defecto del GITHUB_TOKEN
# dependen de un ajuste del repositorio (pueden incluir escritura).
permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      # Pineada: "pip install ruff" sin versión agarra la última en PyPI en
      # el momento del run, así que un release de ruff que cambie las reglas
      # default (pasó en la 0.16, sumó I/RUF/PYI al set por defecto) rompe
      # el lint sin que nadie haya tocado una línea de código. Actualizar a
      # mano cuando se audite el código nuevo contra la versión nueva.
      - name: Install ruff
        run: pip install ruff==0.15.8

      - name: Check style
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      # Falla si se tocó docs/*.md, style.css o script.js sin regenerar la
      # landing: sin esto el ?v= queda viejo y Cloudflare sigue sirviendo el
      # asset anterior. Solo stdlib, no necesita instalar nada.
      - name: Check landing (docs + cache-busting)
        run: python landing/build_docs.py --check

  tests:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    # Stack de producción (Python 3.14 + PostgreSQL 18) como entrada principal.
    # 3.12 + PostgreSQL 16 queda como piso de compatibilidad (el proyecto
    # declara Python 3.11+): si molesta o se vuelve lento, se puede quitar.
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.14'
            pg: '18'
          - python: '3.12'
            pg: '16'
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_USER: purgito_app
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: purgito_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U purgito_app -d purgito_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://purgito_app:ci-password@127.0.0.1:5432/purgito_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      # El pg_dump/pg_restore que trae ubuntu-latest es el 16 y se niega a
      # volcar un servidor 18: se instala el cliente 18 desde PGDG.
      - name: Cliente de PostgreSQL 18 (pg_dump/pg_restore)
        if: matrix.pg == '18'
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-18
          pg_dump --version

      # age: los tests de backup_db.sh comprueban el cifrado de los backups.
      - name: Install age
        run: sudo apt-get install -y --no-install-recommends age

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest==9.1.1 coverage==7.16.2

      # La cobertura se mide sobre src/. El piso está unos puntos por debajo de
      # lo que hay hoy (74%): no pide escribir tests por cumplir, solo evita que
      # la cobertura baje sin que nadie lo note al agregar código sin tests.
      - name: Run tests (con cobertura)
        run: coverage run --source=src -m pytest tests -q

      - name: Cobertura mínima
        run: coverage report --skip-empty --fail-under=70

  # Busca CVEs conocidos en las versiones pineadas de requirements.txt.
  # Dependabot sube versiones pero no avisa de una vulnerabilidad en la que
  # ya está instalada; esto sí. Falla si alguna dependencia tiene un
  # advisory sin parche aplicado.
  audit:
    name: Auditoría de dependencias (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install pip-audit
        run: pip install pip-audit==2.9.0

      - name: Auditar requirements.txt
        run: pip-audit -r requirements.txt

  # deploy/*.sh corren en producción (backups, preflight, unit de systemd) y
  # hasta ahora ningún CI los miraba: un error de sintaxis o un backup que ya
  # no se puede restaurar aparecía recién cuando hacía falta. shellcheck solo
  # en nivel warning: los avisos de estilo (SC2001, SC2181) no frenan nada.
  scripts:
    name: Scripts de deploy (shellcheck + self-check)
    runs-on: ubuntu-latest
    # PostgreSQL 18, igual que producción.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: purgito_app
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: purgito_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U purgito_app -d purgito_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://purgito_app:ci-password@127.0.0.1:5432/purgito_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: shellcheck
        run: shellcheck --severity=warning deploy/*.sh

      # El pg_dump/pg_restore que trae ubuntu-latest es el 16 y se niega a
      # volcar un servidor 18: se instala el cliente 18 desde PGDG.
      - name: Cliente de PostgreSQL 18 (pg_dump/pg_restore)
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-18

      - name: Install age
        run: sudo apt-get install -y --no-install-recommends age

      # backup_db.sh + restore_check.sh contra una base PostgreSQL de pruebas:
      # verifica el dump, la restauración, la poda, los permisos y que un backup
      # corrupto se rechaza. La base de descarte de la restauración se crea acá.
      - name: Base de descarte para restore_check
        run: |
          PGPASSWORD=ci-password psql -h 127.0.0.1 -U purgito_app -d purgito_test \
            -c 'CREATE DATABASE purgito_restorecheck'

      - name: Self-check de backup y restauración
        run: |
          pg_dump --version
          RESTORE_CHECK_DB=purgito_restorecheck bash deploy/backup_db_test.sh

  # Tests de JS del dashboard y del selector de idioma de la landing: solo
  # necesitan Node (ya viene en ubuntu-latest), sin instalar dependencias.
  landing-js:
    name: Landing (tests de JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Versión de Node
        run: node --version

      - name: Selector de idioma
        run: node landing/test_lang.mjs

      - name: Dashboard
        run: node landing/test_dash.mjs

      - name: Historial
        run: node landing/test_historial.mjs

  secrets:
    name: Escaneo de secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0: gitleaks escanea el historial completo, no solo
      # el último commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Se corre el binario de gitleaks directo en vez de gitleaks-action:
      # la action pasó a exigir un GITLEAKS_LICENSE pago para repos de
      # organización (Purgito lo es) — ver github.com/gitleaks/gitleaks-action
      # § "-Announcement". El binario en sí sigue siendo open source y no
      # tiene ese gate. Versión y checksum pineados a mano; actualizar
      # ambos juntos desde github.com/gitleaks/gitleaks/releases.
      - name: Instalar gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 755 gitleaks /usr/local/bin/gitleaks

      - name: Escanear secretos
        run: gitleaks git --config .gitleaks.toml -v .
