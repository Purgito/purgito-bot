name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff

      - name: Check style
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      # Falla si se tocó docs/*.md, style.css o script.js sin regenerar la
      # landing: sin esto el ?v= queda viejo y Cloudflare sigue sirviendo el
      # asset anterior. Solo stdlib, no necesita instalar nada.
      - name: Check landing (docs + cache-busting)
        run: python landing/build_docs.py --check
